server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the Compose service again after container recreation/IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location = /health {
        include /etc/nginx/proxy-backend.conf;
    }

    location = /api {
        include /etc/nginx/proxy-backend.conf;
    }

    location /api/ {
        include /etc/nginx/proxy-backend.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
